[pytest]
testpaths = tests
# The slow ones are excluded by default: `pytest` stays a few seconds, which
# is what makes it worth running between edits. Run them before a release
# with `pytest -m slow`, or everything with `pytest -m ""`.
addopts = -m "not slow"
markers =
    game: needs a real cartridge dump (*.gba) at the repository root
    slow: builds a whole ROM (minutes, not seconds) — run before a release
